[project]
name = "a2a-recovery"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
  "a2a-sdk[http-server]==1.3.0",
  "uvicorn>=0.30",
  "cryptography>=43",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["recovery", "agents", "agents.tools", "bench", "bench.scenarios", "baselines", "baselines.temporal_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
